<!DOCTYPE html

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectatwo Moto</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/logo/my-logo.ico" rel="icon">
  <link href="assets/img/logo/my logo.png" rel="apple-touch-icon">
 
  <!-- Css file -->
  <link rel="stylesheet" href="style/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<body>
  <div class="wrapper">
    <header>Signup Form</header>
    <form action="#">
      <div class="field name">
        <div class="input-area">
          <input type="text" placeholder="Full name" required>
          <i class="icon fas fa-user"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Name can't be blank</div>
      </div>
      <div class="field email">
        <div class="input-area">
          <input type="text" placeholder="Email Address" required>
          <i class="icon fas fa-envelope"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Email can't be blank</div>
      </div>
      <div class="field password">
        <div class="input-area">
          <input type="password" placeholder="Password" required>
          <i class="icon fas fa-lock"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Password can't be blank</div>
      </div>
      <div class="field cpassword">
        <div class="input-area">
          <input type="password" placeholder="Confirm Password"required>
          <i class="icon fas fa-lock"></i>
          <i class="error error-icon fas fa-exclamation-circle"></i>
        </div>
        <div class="error error-txt">Confirm Password can't be blank</div>
      </div>
      <input type="submit" href="#" value="Signup">
    </form>
    <div class="sign-txt" >Already have an account? <a href="login.html">Login</a></div>
  </div>


    <script src="assets/js/script.js"></script>


</body>
</html>>
